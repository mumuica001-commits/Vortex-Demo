<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { background: #222; color: #eee; font: 14px/1.4 sans-serif; padding: 24px; }
    .row { display: flex; gap: 28px; align-items: flex-end; margin: 28px 0; }
    .cell { text-align: center; }
    .cell span { display: block; margin-top: 8px; font-size: 11px; color: #aaa; }
    .tile { background: #111; padding: 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <p>Vortex favicon variants — 16 / 32 / 128</p>

  <!-- A: filled tomoe commas -->
  <div class="row" data-name="A-tomoe">
    <div class="cell"><div class="tile">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="16" height="16">
        <rect width="32" height="32" fill="#050806"/>
        <g fill="#0AE39C" transform="translate(16 16)">
          <path d="M-1.1-1.6C-0.2-9.6 10.2-10.8 11.6-3.2C12.4 1.6 6.2 4.2 1.2.9C.2-.1-.2.1-1.1-1.6Z"/>

        </g>
      </svg>
    </div><span>A 16</span></div>
    <div class="cell"><div class="tile">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
        <rect width="32" height="32" fill="#050806"/>
        <g fill="#0AE39C" transform="translate(16 16)">
          <path d="M-1.1-1.6C-0.2-9.6 10.2-10.8 11.6-3.2C12.4 1.6 6.2 4.2 1.2.9C.2-.1-.2.1-1.1-1.6Z"/>
          <path d="M-1.1-1.6C-0.2-9.6 10.2-10.8 11.6-3.2C12.4 1.6 6.2 4.2 1.2.9C.2-.1-.2.1-1.1-1.6Z" transform="rotate(120)"/>
          <path d="M-1.1-1.6C-0.2-9.6 10.2-10.8 11.6-3.2C12.4 1.6 6.2 4.2 1.2.9C.2-.1-.2.1-1.1-1.6Z" transform="rotate(240)"/>
        </g>
      </svg>
    </div><span>A 32</span></div>
    <div class="cell"><div class="tile">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128">
        <rect width="32" height="32" fill="#050806"/>
        <g fill="#0AE39C" transform="translate(16 16)">
          <path d="M-1.1-1.6C-0.2-9.6 10.2-10.8 11.6-3.2C12.4 1.6 6.2 4.2 1.2.9C.2-.1-.2.1-1.1-1.6Z"/>

        </g>
      </svg>
    </div><span>A 128</span></div>
  </div>

    <div class="cell"><div class="tile">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="16" height="16">
        <rect width="32" height="32" fill="#050806"/>
        <g fill="#0AE39C" transform="translate(16 16)">
          <path d="M-2-2C-2-11 11-12 12.4-3.4C13.2 2.2 6.8 5.2 1.6 1.4L-2-2Z"/>

    </div><span>B 16</span></div>
    <div class="cell"><div class="tile">

        <rect width="32" height="32" fill="#050806"/>

    <div class="cell"><div class="tile">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="16" height="16">
        <rect width="32" height="32" fill="#050806"/>
        <g fill="none" stroke="#0AE39C" stroke-width="4.2" stroke-linecap="round" transform="translate(16 16)">
          <path d="M1.2-2.4 A9 9 0 0 1 9.2 6.2"/>

    <div class="cell"><div class="tile">

          <path d="M1.2-2.4 A9 9 0 0 1 9.2 6.2"/>

    </div><span>C 128</span></div>

    <div class="cell"><div class="tile">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="16" height="16">
        <rect width="32" height="32" fill="#050806"/>
        <g fill="#0AE39C" transform="translate(16 16)">
          <path d="M-1.4-1.2 C-0.6-9.2 5.5-12.2 9.8-8.4 C12.6-5.6 11.2-0.4 6.2 0.6 C3.2 1.2 0.8 0.2 -1.4-1.2Z"/>
