<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body { margin:0; background:#888; }
  .wrap { display:flex; gap:24px; align-items:flex-end; padding:24px; }
  .cell { text-align:center; font:11px sans-serif; color:#222; }
  .tile { background:#333; padding:6px; display:inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="cell"><div class="tile"><img src="favicon.svg" width="16" height="16"></div><div>16</div></div>
  <div class="cell"><div class="tile"><img src="favicon.svg" width="32" height="32"></div><div>32</div></div>
  <div class="cell"><div class="tile"><img src="favicon.svg" width="64" height="64"></div><div>64</div></div>
  <div class="cell"><div class="tile"><img src="favicon.svg" width="128" height="128"></div><div>128</div></div>
</div>
</body>
</html>
